<!DOCTYPE html>
<html lang="zh_TW"> <!--語系-->
  <head>
  
    <meta charset="UTF-8"> <!--編碼系統-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!--確認任何裝置上的顯示沒有跑掉-->
    <link rel="stylesheet" href="styles.css"> <!--連結外部CSS-->
    <title>星之交界 Junction of Stars</title> <!--網頁標題-->
    <script src="script.js" defer></script>

  </head>
  
  <body>
  
    <div id="weatherSystem">
        <div class="weather-bg"></div>
        <div class="rain-layer layer1"></div>
        <div class="rain-layer layer2"></div>
    </div>
  
  
  
    <!-- 側邊欄 -->
    <div id="sidebar">
	  <div class="sidebar_header">
	    <!-- 縮放鈕 -->
	    <div class="toggle_btn" onclick="toggleSidebar()" id="toggleBtn">◀
		</div>
		<!-- 日期時間 -->
		<div class="date_time datezoom" id="dateAndTime">2056年 8月 15號 星期五
		</div>
		<!-- 角色欄 -->
		<div class="char_card" id="charCard">
            <div class="player">		
		        <img src="player.png" alt="player" />
			</div>
			<div class="time_money">
			    <div class="money_" id="money">$ 1000</div>
				<div class="time_" id="time">08:00</div>
			</div>
		</div>
      </div>
	  <div class="sidebar_scroll_content">
	        <div class="status_drink_wrapper">
		        <!-- 狀態欄 -->
		        <div class="status_item" id="statusBar">
	        	    <span class="statustext">體力</span>
	            	<div class="status_bar">
        			    <div class="status_fill" id="體力"></div>
        			</div>
        		    <span class="statustext">行動</span>
        			<div class="status_bar">
          			    <div class="status_fill" id="行動"></div>
        			</div>
        			<span class="statustext">飽食</span>
        			<div class="status_bar">
        			    <div class="status_fill" id="飽食"></div>
        			</div>
        			<span class="statustext">口渴</span>
        			<div class="status_bar">
        			    <div class="status_fill" id="口渴"></div>
        			</div>
         			<span class="statustext">整潔</span>
          			<div class="status_bar">
        			    <div class="status_fill" id="整潔"></div>
	        		</div>
        			<span class="statustext">情緒</span>
        			<div class="status_bar">
        			    <div class="status_fill" id="情緒"></div>
        			</div>
        			<span class="statustext">壓力</span>
        			<div class="status_bar">
        			    <div class="status_fill" id="壓力"></div>
	        		</div>
        		</div>
		        <!-- 飲料欄 -->
		        <div class="drink_bar" id="drinkBar">		   
			        <div class="drink_wrapper" id="drinkWrapper">
				        <img id="drinkImg" src="tea.png" class="drink_image" alt="drink" />
		            </div>
			        <img src="cup_outline.png" alt="drink_cap"  class="cup_outline">			
		        </div>
            </div>
		<div class="drink_minimized_icon" id="drinkMinIcon" onclick="toggleDrinkbar()">
		    <div class="drink_icon">🥤</div>
		</div> 
		<!-- 背包 -->
		<div class="grid-container" id="mainBag">						
		</div>
        <div class="handbag_minimized_icon" id="handbagMinIcon" onclick="toggleHandbag()">
		    <div class="handbag_icon">👜</div>
		</div>		
		<!-- 按鈕群 -->
		<div class="btngroup" id="btnGroup">
		    <button class="btn" id="codexbtn">圖鑑</button>
			<button class="btn" id="diarybtn">日記</button>
			<button class="btn" id="settingbtn">設定</button>
			<button class="btn" id="savebtn">存檔</button>
		</div>
		<div class="game_tips" id="gameTups">
		    小提示：123456
		</div>
	  </div>				
	</div>
	<!-- 故事/互動文字區 -->
	<div class="main_content_box" id="mainContentBox">
	    <div class="story_box" id="storyBox">
		    <h1 class="position_title" id="positionTitle">育幼院 ‧ 房間</h1>
		    <p class="story_text" id="storyText">你位在你的房間裡，這裡有一張單人床設置在牆邊。
			<br>
			外頭的雨敲擊著窗戶。</p>
            <nav class="nursery_room_bed" id="nurseryRoomBed">
			你的床很乾淨
		        <a href="#" id="goRest">上床睡覺</a>
	            <a href="#" id="changeClothesRest">換衣服睡覺</a>
	        </nav>
	        <nav class="nursery_room_interact" id="nurseryRoomInteract">
			查看
		        <a href="#" id="nursery_room_wardrobe">衣櫃</a>
	            <a href="#" id="nursery_room_mirror">鏡子</a>
			    <a href="#" id="nursery_room_dwarf">矮櫃</a>
	        </nav>
	        <nav class="leave_nursery_room" id="leaveNurseryRoom">
			前往
		        <a href="#" id="loc_nursery_bathroom">浴室</a>
	            <a href="#" id="loc_nursery_kitchen">廚房</a>
			    <a href="#" id="loc_nursery_mainhall">大廳</a>
			    <a href="#" id="leave_nursery">離開育幼院</a>
	        </nav>			
		</div>
        
	
	</div>
	
	
	
  </body>
</html>
